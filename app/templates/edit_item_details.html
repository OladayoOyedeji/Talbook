<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="/static/styles/item_details.css"> <link rel="stylesheet" href="/static/styles/tags.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="{{ url_for('item_details', item_id=item.id) }}" class="back-button">
                <i class="fas fa-arrow-left"></i> Back to Item
            </a>
            <h1 class="item-title">Edit Item</h1> </header>

        <main class="item-details edit-item-form">  <form method="POST" enctype="multipart/form-data">
                <section class="info-section">
                    <div class="info-card">
                        <h2 class="section-title">Basic Information</h2>
                        <div class="form-group">
                            <label for="item_name">Item Name:</label>
                            <input type="text" id="item_name" name="item_name" value="{{ item.item_name }}" required>
                        </div>
                        <div class="form-group">
                            <label for="price">Price:</label>
                            <input type="number" id="price" name="price" value="{{ item.price }}" min="0.01" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="condition">Condition:</label>
                            <select id="condition" name="condition" required>
                                <option value="New" {% if item.condition == 'New' %}selected{% endif %}>New</option>
                                <option value="Used - Like New" {% if item.condition == 'Used - Like New' %}selected{% endif %}>Used - Like New</option>
                                <option value="Used - Good" {% if item.condition == 'Used - Good' %}selected{% endif %}>Used - Good</option>
                                <option value="Used - Fair" {% if item.condition == 'Used - Fair' %}selected{% endif %}>Used - Fair</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="descrip">Description:</label>
                            <textarea id="descrip" name="descrip" rows="5">{{ item.descrip }}</textarea>
                        </div>
                    </div>
                </section>

                <div class="form-actions">
                    <button type="submit" class="save-button">Save Changes</button>
                    <a href="{{ url_for('item_details', item_id=item.id) }}" class="cancel-button">Cancel</a>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
