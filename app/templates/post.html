<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Media Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f6f7;
      margin: 0;
      padding: 20px;
    }

    .media-container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .media-item {
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      padding: 15px;
    }

    .media-id {
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }

    .media-preview {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .media-description {
      margin: 8px 0;
      color: #555;
    }

    .media-timestamp {
      font-size: 0.9em;
      color: #999;
    }

    video.media-preview {
      background-color: #000;
    }
  </style>
</head>
<body>
  <div class="media-container">
    <h1>Uploaded Media</h1>

    <!-- Media Item 1 (Image) -->
    <div class="media-item">
      <div class="media-id">ID: media_001</div>
      <img class="media-preview" src="/media/image1.jpg" alt="Image preview">
      <div class="media-description">A sunset over the ocean with beautiful orange and purple skies.</div>
      <div class="media-timestamp">Uploaded: 2025-04-10 14:32</div>
    </div>

    <!-- Media Item 2 (Video) -->
    <div class="media-item">
      <div class="media-id">ID: media_002</div>
      <video class="media-preview" controls>
        <source src="/media/video1.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div class="media-description">Short clip of waves crashing on the beach with ambient sound.</div>
      <div class="media-timestamp">Uploaded: 2025-04-09 10:21</div>
    </div>

    <!-- Add more media items dynamically as needed -->
  </div>
</body>
</html>
