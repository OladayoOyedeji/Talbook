<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Media Carousel</title>
    <style>
      body {
          font-family: Arial, sans-serif;
          background-color: #f5f6f7;
          margin: 0;
          padding: 20px;
      }

      .media-container {
          max-width: 700px;
          margin: auto;
          text-align: center;
      }

      h1 {
          margin-bottom: 30px;
      }

      .media-item {
          display: none;
      }

      .media-preview {
          width: 100%;
          max-width: 640px;
          height: 360px;
          object-fit: cover; /* Ensures media fills the box without distortion */
          border-radius: 8px;
          background-color: #000; /* Useful for videos or if images are still loading */
      }

      .media-controls {
          margin-top: 20px;
      }

      button {
          padding: 10px 20px;
          margin: 0 10px;
          font-size: 16px;
          cursor: pointer;
          border: none;
          border-radius: 5px;
          background-color: #007bff;
          color: white;
      }

      button:disabled {
          background-color: #aaa;
          cursor: not-allowed;
      }

      .media-description {
          margin-top: 20px;
          color: #555;
      }

      .media-timestamp {
          margin-top: 5px;
          font-size: 0.9em;
          color: #999;
      }

      video.media-preview {
          background-color: #000;
      }
    </style>
  </head>
  <body>
    <div class="media-container">
      <h1>Uploaded Media</h1>

      <!-- Media Carousel -->
      {% for media in post.media %}
      <div class="media-item" id="media-{{ loop.index0 }}">
        <div class="media-id">ID: {{ media[0] }}</div>
        {% if media[2] == 'photo' %}
        <img class="media-preview" src="/static/images/store/{{ media[1] }}.webp" alt="Image preview">
        {% elif media[2] == 'video' %}
        <video class="media-preview" controls muted>
          <source src="/static/videos/store/{{ media[1] }}.mp4" type="video/mp4" />
        </video>
        {% endif %}
      </div>
      {% endfor %}

      <div class="media-controls">
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
      </div>

      <div class="media-description">{{ post.descrip }}</div>
      <div class="media-timestamp">Uploaded: {{ post.created_at }}</div>
    </div>

    <script>
      const mediaItems = document.querySelectorAll('.media-item');
      let currentIndex = 0;

      function showMedia(index) {
          mediaItems.forEach((item, i) => {
              item.style.display = i === index ? 'block' : 'none';
              // Pause all videos when switching
              const video = item.querySelector('video');
              if (video) video.pause();
          });

          document.getElementById('prevBtn').disabled = index === 0;
          document.getElementById('nextBtn').disabled = index === mediaItems.length - 1;

          // Auto play if it's a video
          const currentMedia = mediaItems[index];
          const currentVideo = currentMedia.querySelector('video');
          if (currentVideo) {
              currentVideo.play().catch(() => {});
          }
      }

      document.getElementById('prevBtn').addEventListener('click', () => {
          if (currentIndex > 0) {
              currentIndex--;
              showMedia(currentIndex);
          }
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
          if (currentIndex < mediaItems.length - 1) {
              currentIndex++;
              showMedia(currentIndex);
          }
      });

      // Show first media on load
      showMedia(currentIndex);
    </script>
  </body>
</html>
