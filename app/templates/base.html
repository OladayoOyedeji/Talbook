<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Talbook</title>
  <link rel="stylesheet" href="/static/styles/talbook.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
      color: #4f46e5;
    }

    .button-group {
      display: flex;
      gap: 1rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      color: white;
      background-color: #4f46e5;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #4338ca;
    }
  </style>
</head>
<body>
  <h1>Talbook</h1>
  <div class="button-group">
    <a href="/signup" class="btn">Sign Up</a>
    <a href="/login" class="btn">Log In</a>
  </div>
</body>
</html>
