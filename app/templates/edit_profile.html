
<link rel="stylesheet" href="/static/styles/home.css">
<link rel="stylesheet" href="/static/styles/edit_profile.css">
<header class="header">
  <a href="{{ url_for('home') }}" class="back-button">
    <i class="fas fa-arrow-left"></i> Back to Bazaar
  </a>
</header>
<div class="edit-photo">
  <img src="/static/images/uploads/{{ profile.photo_id }}.png"
       onerror="this.onerror=null; this.src='/static/images/defaults/default_item.png';"
       class="item-image" />
</div>

<!-- Form to upload photo -->
<form method="post" enctype="multipart/form-data" action="{{ url_for('edit_profile') }}">
  <label for="file">Change photo:</label>
  <input type="file" name="file" id="file" />
  <input type="submit" name="submit_photo" value="Submit Photo" /><br>
</form>

<!-- Form to update user info -->
<form method="post" enctype="multipart/form-data" action="{{ url_for('edit_profile') }}">
  <label for="username">Username:</label>
  <input type="text"
         class="form-control"
         id="username"
         name="username"
         value="{{ profile.username }}"><br>

  <label for="email">Email:</label>
  <input type="text"
         class="form-control"
         id="email"
         name="email"
         value="{{ profile.email }}"><br>

  <label for="pepBio">Description:</label>
  <textarea class="form-control"
            id="pepBio"
            name="descrip"
            placeholder="Enter description">{{ profile.descrip }}</textarea><br>

  <input type="submit" name="submit_info" value="Save Changes">
</form>
